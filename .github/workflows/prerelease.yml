name: Build and prerelease

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build native libraries and agent JAR
        run: bash scripts/build.sh
      - name: Package source
        run: git archive --format=zip --prefix=jnitrace/ -o target/jnitrace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: |
            target/jnitrace.jar
            target/jnitrace-source.zip

  prerelease:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: target
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: prerelease-${{ github.run_number }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            target/jnitrace.jar target/jnitrace-source.zip \
            --target "$COMMIT" \
            --title "jnitrace $RELEASE_TAG" \
            --generate-notes --prerelease --latest=false
